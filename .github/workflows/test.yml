name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check generated key tables
        if: matrix.os == 'macos-latest'
        run: |
          go generate ./key
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - name: Test without cgo
        run: go test ./...
        env:
          CGO_ENABLED: 0
      - run: go build ./examples/...
      - name: Build without cgo for every platform
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build ./... ./examples/...
          done
